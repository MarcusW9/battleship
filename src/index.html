<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>Marcus' Battleship</title>
        <link rel="stylesheet" href="style.css">
  <!-- Use type="module" to allow ES6 import/export statements -->
        <script src="index.js" type="module" defer></script>
    </head>
    <body>
        <header>
            <h1>BATTLESHIP</h1>
            <p>Prepare your fleet for battle!</p>
        </header>

<!-- SCREEN 1: Player Setup -->
        <section id="setup-screen" class="screen">
            <img id="form-image" src="./assets/Setup_Screen_Background.jpg" alt="Battleship in the ocean">
            <form id="start-form">
                <label for="player-name">Enter Commander Name:</label>
                <input type="text" id="player-name" placeholder="Admiral" required />
                <button type="submit" class="btn">Deploy Fleet</button>
            </form>
        </section>

<!-- SCREEN 2: Battle Arena (HIDDEN on page load) -->
        <section id="battle-screen" class="screen hidden">
            <header>
                <h2 id="player-title">Admiral's Fleet</h2>
            </header>

            <main class="game-container">
                <div id="placement-container">
                    <button id="rotate-ship-btn">Rotate axis</button>
                    <div id="placement-board" class="grid"></div>
                    <button id="start-battle-btn">Engage Enemy</button>
                </div>

                <div id="combat-view" class="hidden">
                    <div id="player-board" class="grid"></div>
                    <div id="enemy-board" class="grid"></div>
                </div>
            </main>
        </section>
    </body>
</html>
